[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "avalanche_graph_dynamics"
version = "1.0.0"
description = "A Python engine modelling non-Abelian state changes and history dependant propagation (The Avalanche Effect) in dynamic complete graphs using modulo 2 arithmetic. "
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Raj123-0"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/Raj123-0/avalanche-graph-dynamics"

[tool.setuptools]
py-modules = ['main']
